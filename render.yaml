services:
  - type: web
    name: socrate-python
    env: python
    buildCommand: pip install -r requirements.txt && python build.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false